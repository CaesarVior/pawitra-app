server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html/views;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* ^/(assets|img|config|lang)/ {
        root /usr/share/nginx/html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}